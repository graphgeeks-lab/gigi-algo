id: tiny-directed
description: >
  The smallest useful directed graph: three nodes, every node has an outgoing
  edge, no weights, no self loops. If engines disagree here, something is
  badly wrong.
directed: true
node_id: id
edges:
  source: source
  target: target
  weight: null
features:
  weighted: false
  dangling_nodes: false
  disconnected: false
  self_loops: false
  duplicate_edges: false
expected:
  nodes: 3
  edges: 4
