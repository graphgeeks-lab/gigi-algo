# Build the image, prove it works, then publish it.
#
# The proving is the point. A container that starts is not the same as a
# container that can verify the registry, and the difference is invisible until
# somebody tries. Every push builds and smoke-tests; only a tag publishes.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build, smoke-test, and publish on a tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated on an amd64 runner, so the publish step below needs
      # QEMU registered before buildx can target it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Built to the local daemon first so the smoke test runs against the
      # exact image that would be published, rather than a rebuild of it.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gigi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Output is captured to a file before it is searched. Piping `docker run`
      # into `grep -q` makes grep exit on its first match, docker take SIGPIPE,
      # and `pipefail` fail the step -- a flake that depends on how fast grep
      # finds the line.
      - name: It is a complete registry, not just an entrypoint
        run: |
          set -euo pipefail
          docker run --rm gigi:ci list > /tmp/list.txt
          docker run --rm gigi:ci people > /tmp/people.txt
          docker run --rm gigi:ci ask "which nodes are most important" > /tmp/ask.txt

          grep -q pagerank /tmp/list.txt \
            || { echo "::error::The image lists no methods -- registry content did not ship."; exit 1; }
          grep -q dennis-irorere /tmp/people.txt \
            || { echo "::error::people.yaml did not ship in the image."; exit 1; }
          grep -q pagerank /tmp/ask.txt \
            || { echo "::error::gigi ask found nothing; problems/ may not have shipped."; exit 1; }

      - name: Every backend is present, so verification means something
        run: |
          set -euo pipefail
          docker run --rm gigi:ci backends > /tmp/backends.txt
          for backend in reference networkx igraph rustworkx scipy sklearn; do
            grep -q "$backend" /tmp/backends.txt \
              || { echo "::error::backend $backend missing from the image."; exit 1; }
          done
          docker run --rm gigi:ci verify

      - name: It runs as a non-root user
        run: |
          set -euo pipefail
          UID_IN_IMAGE=$(docker run --rm --entrypoint id gigi:ci -u)
          [ "$UID_IN_IMAGE" != "0" ] \
            || { echo "::error::The image runs as root."; exit 1; }

      # The default command is an MCP server, so the handshake is the thing
      # that actually has to work. A broken stdio loop looks like a hang in
      # somebody's editor, days later.
      - name: The MCP server answers a handshake and a tool call
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"gigi_ask","arguments":{"question":"is my graph connected"}}}' \
            | docker run -i --rm gigi:ci > /tmp/mcp.jsonl
          python - <<'PY'
          import json, sys
          lines = [json.loads(line) for line in open("/tmp/mcp.jsonl")]
          # Three requests, one notification: a reply to the notification would
          # be a protocol violation, so the count is part of the test.
          assert len(lines) == 3, f"expected 3 responses, got {len(lines)}"
          assert lines[0]["result"]["serverInfo"]["name"] == "gigi"
          assert len(lines[1]["result"]["tools"]) >= 8, "tools went missing"
          body = json.loads(lines[2]["result"]["content"][0]["text"])
          assert "connected_components" in body["answered_by"], body
          print("MCP handshake, tools/list and tools/call all good")
          PY

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Published for both architectures: an Apple-silicon laptop running
          # this as an MCP server is the common case, and emulation is slow
          # enough to be noticed on every tool call.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
