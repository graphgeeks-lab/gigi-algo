name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The "minimal" job is the one that matters for contributors: the suite
        # must pass with only NetworkX installed, skipping backends that are not
        # there rather than failing on them.
        backends: [minimal, all]
    name: test (${{ matrix.backends }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.backends }}" = "minimal" ]; then
            pip install -e ".[networkx]" pytest
          else
            pip install -e ".[dev]"
          fi
      - name: Which backends are present
        run: gigi backends
      - name: Test
        run: pytest -q
      - name: Verify the registry against reality
        run: gigi verify

  site:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: gigi site build --output site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  docs:
    name: Build Sphinx handbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
