# ---------------------------------------------------------------------------
# A WORKING EXAMPLE, not a set of blanks.
#
# This template implements degree centrality end to end: a readable reference
# implementation, a NetworkX adapter, and a spec that validates. Copy the
# directory, run it, then replace the algorithm with yours one piece at a time.
#
#   cp -r algorithms/_template algorithms/<your_algorithm_id>
#   gigi run <your_algorithm_id> --graph tiny-directed --engine reference
#   gigi compare <your_algorithm_id> --graph tiny-directed
#   gigi verify <your_algorithm_id>
#
# Directories starting with `_` are skipped by the registry, so nothing here
# runs until you copy it under a real id. The copy is exercised by
# tests/test_template.py, so this example cannot quietly stop working.
# ---------------------------------------------------------------------------

id: my_algorithm            # must match the directory name
name: Degree Centrality     # replace with yours
aliases: [degree]
family: centrality          # must be an id from families/families.yaml
maturity: emerging          # start here; `stable` requires testable divergences

problem: >
  Rank nodes by how many connections they have.

# Where the algorithm came from, historically. This is a separate question from
# who implemented it here -- see the `gigi:` block below, and
# docs/adr/0007-attribution-has-layers.md.
#
# Resist the urge to write a single `inventor:`. Most algorithms have
# precursors, independent discoveries and later generalisations, and the famous
# name is rarely the whole story. Degree centrality is a good example: counting
# a node's connections is older than any citation, and what Freeman contributed
# in 1978 was the normalisation and the conceptual framing.
provenance:
  introduced: 1978

  original_authors:
    - name: Linton C. Freeman
      note: >
        Formalised and normalised the measure; the underlying idea of counting
        connections predates the paper and has no single attributable origin.

  original_work:
    title: "Centrality in social networks conceptual clarification"
    year: 1978
    venue: Social Networks 1(3)
    doi: 10.1016/0378-8733(78)90021-7
    url: null

  precursors:
    - name: Group structure and leadership
      year: 1954
      authors: [Alex Bavelas, Marvin E. Shaw]
      note: >
        Earlier social-network work using connection counts to identify
        central positions, without the normalised definition.

  attribution_notes: >
    Cite Freeman for the definition, not for the idea. On a directed graph
    "degree" may mean in-degree, out-degree or their sum, and engines differ --
    which makes this a good first algorithm to look for divergences in.

# Who did the work in Gigi. Every id must exist in people/people.yaml, or the
# test suite fails. Delete the roles that do not apply to you.
gigi:
  spec_curators: [dennis-irorere]
  reference_implementation: [dennis-irorere]
  adapter_contributors:
    networkx: [dennis-irorere]

intent:
  solves:
    - simple importance ranking
    - finding hubs
  not_for:
    - recursive influence
    - shortest path

complexity:
  time: O(V+E)
  space: O(V)

# The mathematics, in a form something other than a person can use. maths.md is
# the exposition; this block is what an agent, a verifier or a citation needs.
# The two must not disagree -- if you change one, change the other.
maths:
  summary: >
    Each node's degree, optionally divided by the largest degree it could have.

  definition:
    statement: |
      C(v) = deg(v) / (n - 1)

      n is the node count and deg(v) the number of edges incident to v. On a
      directed graph this implementation reads deg(v) as in-degree plus
      out-degree, which is a choice -- see under_determined below.
    latex: 'C(v) = \frac{\deg(v)}{n - 1}'

  # Checked on every run, on every engine, on every fixture. An invariant id
  # must name a check in gigi/invariants.py or the test suite fails. This is
  # the cheapest verification you get: state a property, and it is asserted
  # everywhere for free.
  invariants:
    - id: scores_non_negative
      statement: "C(v) >= 0 for every v"
      latex: 'C(v) \geq 0'
      check: true
    - id: scores_finite
      statement: No score is NaN or infinite.
      check: true

  # Where the definition leaves a choice open. This is the most useful part of
  # the block: engines diverge exactly here, so naming the choices tells the
  # next contributor what to test -- and lets a new engine be assessed before
  # it is ever run.
  under_determined:
    - id: degree_direction
      question: On a directed graph, does "degree" mean in, out, or both?
      choices:
        - in-degree plus out-degree (this implementation, and networkx)
        - in-degree only
        - out-degree only
      datasets: [tiny-directed]
      note: All three are defensible readings; engines do not all agree.

    - id: normalisation
      question: Is the degree divided by (n - 1), and can that be turned off?
      choices:
        - always normalise (networkx offers no option)
        - normalise only when asked
      note: >
        When an engine gives no way to turn it off, the adapter must undo it
        and say so in its effective parameters rather than quietly returning
        a number the engine did not produce.


requirements:
  directed:
    supported: true
    preferred: false
  weighted:
    supported: false
  negative_weights:
    supported: false

parameters:
  # `common_default: null` means "let the engine decide" -- which is precisely
  # where engines disagree. Only give a default when every engine agrees on it.
  - name: normalized
    type: bool
    common_default: true
    description: Divide each degree by (n - 1) so scores are comparable across graphs.

output:
  kind: node_score          # node_score is the only kind implemented in v0.1
  score_name: degree_centrality

comparison:
  kind: numeric_vector
  absolute_tolerance: 1.0e-9
  relative_tolerance: 1.0e-9

verification:
  # Conditions under which engines must agree. Pin anything ambiguous here so
  # that a remaining difference is semantic rather than a stopping point.
  parameters: {}

deterministic: true

engines:
  reference:
    supported: true
    notes: Counts in-degree plus out-degree in a single pass over the edges.
  networkx:
    supported: true
    notes: nx.degree_centrality, which uses total degree and always normalises.

datasets:
  # Fixtures the conformance suite runs this algorithm on. Prefer the small
  # adversarial ones -- each should put pressure on a specific decision.
  - tiny-directed

divergences: []
  # Leave this empty if the engines genuinely agree. Do not invent entries:
  # a verified agreement is a useful result too, and belongs in notes.md.
  #
  # - id: engine-some-default
  #   category: default      # default|semantic|numeric|convergence|graph_model|
  #                          # parameter|output|unsupported|bug
  #   severity: high         # info|low|medium|high|critical
  #   engines: [networkx]
  #   summary: >
  #     What differs, stated so a reader can act on it.
  #   consequence: >
  #     What goes wrong for someone who does not know.
  #   discovered_by: [your-person-id]
  #   detect:
  #     # This is what turns the claim into evidence. CI runs it.
  #     datasets: [weighted-small]       # every fixture it reproduces on
  #     engines: [reference, networkx]   # baseline first, subject second
  #     parameters: {}                   # {} means "use engine defaults"
  #     expect: differ                   # differ | match | error

# Typed edges to other algorithms. "see also" tells an agent nothing it can act
# on; a typed, conditioned relationship tells it when a substitution is
# legitimate. Kinds: generalizes, specializes, equivalent_under, alternative_to,
# builds_on, used_by, dual_of. Pointing at an algorithm that does not exist yet
# is fine -- that is how the roadmap gets recorded.
relationships:
  - kind: alternative_to
    algorithm: pagerank
    note: >
      Degree counts endorsements; PageRank weights them by the importance of
      whoever gave them. Degree is the baseline you should beat before
      reaching for anything recursive.

use_cases:
  - a quick baseline before reaching for anything recursive
