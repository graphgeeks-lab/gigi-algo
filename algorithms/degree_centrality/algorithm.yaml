id: degree_centrality
name: Degree Centrality
aliases: [degree, degree centrality]
family: centrality
maturity: emerging

problem: >
  Rank nodes by how many connections they have.

# Where the algorithm came from. Separate from `gigi:` below, which records who
# did the work in this repository. See docs/adr/0007-attribution-has-layers.md.
provenance:
  introduced: 1978

  original_authors:
    - name: Linton C. Freeman
      note: >
        Formalised the measure, normalised it, and placed it alongside
        closeness and betweenness in a single framework. The underlying idea of
        counting a node's connections is much older and has no single
        attributable origin.

  original_work:
    title: "Centrality in social networks conceptual clarification"
    year: 1978
    venue: Social Networks 1(3), 215-239
    doi: 10.1016/0378-8733(78)90021-7
    url: null

  precursors:
    - name: Communication patterns in task-oriented groups
      year: 1950
      authors: [Alex Bavelas]
      note: >
        Early experimental work on how a node's position in a communication
        network affects its role, using connection counts informally.
    - name: Group structure and the behavior of individuals in small groups
      year: 1954
      authors: [Marvin E. Shaw]
      note: Connection counts used to identify central positions, without a normalised definition.

  attribution_notes: >
    Cite Freeman for the definition, not for the idea: counting how many
    connections something has predates any citation, and appears independently
    across sociometry, bibliometrics and graph theory. What 1978 contributed
    was the normalisation by (n - 1) and the framing that makes degree,
    closeness and betweenness comparable as answers to different questions.
    On directed graphs the term is genuinely ambiguous -- in-degree,
    out-degree and their sum are all called "degree centrality" in the
    literature -- which is why `mode` is a parameter here rather than a
    convention.

# Who did the work in Gigi. Every id resolves against people/people.yaml.
gigi:
  spec_curators: [dennis-irorere]
  reference_implementation: [dennis-irorere]
  dataset_curators: [dennis-irorere]
  adapter_contributors:
    reference: [dennis-irorere]
    networkx: [dennis-irorere]
    igraph: [dennis-irorere]
    rustworkx: [dennis-irorere]

intent:
  solves:
    - simple importance ranking
    - finding hubs
    - a baseline to beat before reaching for anything recursive
  not_for:
    - recursive influence
    - brokerage or bridging
    - shortest path

complexity:
  time: O(V+E)
  space: O(V)

# The mathematics, in a form something other than a person can use. maths.md is
# the exposition; this block is what an agent, a verifier or a citation needs.
maths:
  summary: >
    Each node's number of edge incidences, divided by the largest number it
    could have.

  definition:
    statement: |
      C(v) = deg(v) / (n - 1)

      n is the node count and deg(v) the number of edge incidences at v. On a
      directed graph deg(v) is in-degree plus out-degree unless `mode` says
      otherwise.
    latex: 'C(v) = \frac{\deg(v)}{n - 1}'
    note: >
      Dividing by (n - 1) is what turns a count into a centrality: without it
      the measure is not comparable across graphs of different sizes.

  also:
    - statement: "C_in(v) = deg_in(v) / (n - 1),   C_out(v) = deg_out(v) / (n - 1)"
      latex: 'C_{\mathrm{in}}(v) = \frac{\deg^{-}(v)}{n-1}, \quad C_{\mathrm{out}}(v) = \frac{\deg^{+}(v)}{n-1}'
      note: >
        The directed variants. All three are called "degree centrality" in the
        literature, which is why the choice is a parameter here.

  invariants:
    - id: scores_non_negative
      statement: "C(v) >= 0 for every v"
      latex: 'C(v) \geq 0'
      check: true

    - id: scores_finite
      statement: No score is NaN or infinite.
      check: true

    - id: scores_unique_per_node
      statement: Every node has exactly one score.
      check: true
      note: >
        Cheap, but it is what catches an engine that silently omits isolated
        nodes -- and disconnected-small exists to have one.

  # Deliberately no `scores_in_unit_interval`. With mode "all" on a directed
  # graph a node can reach 2, and with parallel edges there is no upper bound
  # at all. Asserting a bound that does not hold would be worse than asserting
  # nothing.

  under_determined:
    - id: degree_direction
      question: On a directed graph, does "degree" mean in, out, or their sum?
      choices:
        - in-degree plus out-degree
        - in-degree only
        - out-degree only
      datasets: [tiny-directed]
      note: >
        All three are defensible and all three appear in the literature. Gigi
        makes it the `mode` parameter rather than picking one silently; every
        engine here defaults to the sum.

    - id: normalisation
      question: Is the degree divided by (n - 1), and can that be turned off?
      choices:
        - always normalise (networkx, rustworkx)
        - never normalise (igraph returns raw counts)
        - normalise only when asked
      datasets: [tiny-directed]
      note: >
        Three engines, three conventions. Gigi pins it, and each adapter says
        in its effective parameters whether the scaling came from the engine or
        from us.

    - id: self_loop_counting
      question: How much does a self loop add to a node's degree?
      choices:
        - two, because it is both an out-edge and an in-edge
        - one
        - nothing, because a node is not its own neighbour
      divergence: rustworkx-degree-incidence-count
      datasets: [self-loop-small]

    - id: parallel_edge_counting
      question: Do two edges between the same pair count once or twice?
      choices:
        - twice, because degree counts incidences
        - once, because degree counts neighbours
      divergence: rustworkx-degree-incidence-count
      datasets: [duplicate-edge-small]

    - id: weight_handling
      question: Should edge weights contribute to degree?
      choices:
        - no; degree counts connections, and weighted degree is a different measure
        - yes, summing weights (usually called strength)
      datasets: [weighted-small]
      note: >
        Gigi's degree_centrality is unweighted. Weighted degree is a distinct
        measure and belongs in its own entry rather than behind a flag here.

requirements:
  directed:
    supported: true
    preferred: false
    notes: Defined on both. On a directed graph the `mode` parameter chooses which incidences count.
  weighted:
    supported: false
    notes: Weights are ignored. Weighted degree ("strength") is a different measure.
  negative_weights:
    supported: false

parameters:
  - name: normalized
    type: bool
    common_default: true
    description: >
      Divide each degree by (n - 1). True is the near-universal convention, so
      Gigi sets it rather than deferring to the engine -- but the engines do
      not agree on whether it is even optional.

  - name: mode
    type: str
    common_default: null
    description: >
      all, in or out, on a directed graph. Unset means the engine's own
      default, which is "all" for every engine here. Ignored on undirected
      graphs, where the distinction does not exist.

output:
  kind: node_score
  score_name: degree_centrality

comparison:
  kind: numeric_vector
  absolute_tolerance: 1.0e-9
  relative_tolerance: 1.0e-9

verification:
  # Both ambiguous parameters pinned, so any remaining difference is semantic.
  parameters:
    normalized: true
    mode: all

deterministic: true

engines:
  reference:
    supported: true
    notes: One pass over the edges, counting incidences.
  networkx:
    supported: true
    notes: Three functions for the three modes; always normalises.
  igraph:
    supported: true
    notes: Graph.degree(mode=..., loops=True); returns raw counts, so Gigi normalises.
  rustworkx:
    supported: true
    notes: Three functions for the three modes; disagrees on parallel edges and self loops.

datasets:
  - tiny-directed
  - dangling-small
  - disconnected-small
  - weighted-small
  - self-loop-small
  - duplicate-edge-small
  - undirected-small

divergences:
  - id: rustworkx-degree-incidence-count
    category: bug
    severity: high
    engines: [rustworkx]
    summary: >
      On three of our seven fixtures, rx.degree_centrality returns values that
      are inconsistent with the node's own in_degree plus out_degree, as
      reported by rustworkx itself. The reference implementation, NetworkX and
      igraph agree with each other and with in+out on all three.
    consequence: >
      Affected nodes are under-scored, and by enough to change the ranking. On
      weighted-small and self-loop-small node c scores 1.0 instead of 2.0, and
      on duplicate-edge-small node a scores 1.0 instead of 2.0 -- in each case
      the top-ranked node changes. Anyone porting an analysis to or from
      rustworkx on a graph with reciprocal edge pairs should check their
      results against a second engine.
    discovered_by: [dennis-irorere]
    reported: "2026-09-03"
    detect:
      datasets: [weighted-small, self-loop-small, duplicate-edge-small]
      engines: [reference, rustworkx]
      parameters: {normalized: true, mode: all}
      expect: differ

relationships:
  - kind: alternative_to
    algorithm: pagerank
    note: >
      Degree counts endorsements; PageRank weights each by the importance of
      whoever gave it. Degree is the baseline to beat before reaching for
      anything recursive, and on many graphs the two rank the top nodes
      identically.

  - kind: specializes
    algorithm: katz_centrality
    condition: >
      Katz centrality with attenuation factor zero counts only paths of length
      one, which is degree.
    note: >
      Degree is the degenerate case of the whole family of path-summing
      centralities: count paths of length one only, and stop.

use_cases:
  - a first look at which nodes are hubs
  - a cheap baseline to compare a more expensive centrality against
  - spotting data-quality problems, since a wildly out-of-range degree usually means a broken join
